name: SwiftStack
description: SwiftStack was a software-defined object and cloud storage company whose data
  platform managed unstructured data at scale across private data centers and public clouds using a
  distributed, shared-nothing architecture built on OpenStack Swift, targeting AI, deep learning, and
  large-dataset workloads. NVIDIA acquired SwiftStack in 2020; the data platform is no longer available
  for sale and only existing-customer support and portal resources remain. This profile was surfaced as
  a portfolio company of Mayfield and enriched by the API Evangelist pipeline, which confirmed there is
  no active public API, developer portal, or SDK surface for the discontinued product.
